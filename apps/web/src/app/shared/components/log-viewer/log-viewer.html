<div class="flex min-h-0 flex-1 flex-col gap-2">
  <div class="flex flex-wrap items-center gap-2">
    <label
      class="text-muted-foreground flex items-center gap-2 text-sm"
      for="dr-log-level"
    >
      {{ 'log.level' | translate }}
      <select
        hlmInput
        id="dr-log-level"
        class="h-8 w-auto"
        [value]="minLevel()"
        (change)="setLevel($any($event.target).value)"
      >
        @for (level of levels; track level) {
        <option [value]="level" [selected]="level === minLevel()">
          {{ 'log.levels.' + level | translate }}
        </option>
        }
      </select>
    </label>
    <span class="flex-1"></span>
    <button
      hlmBtn
      variant="outline"
      size="sm"
      type="button"
      [disabled]="visible().length === 0"
      (click)="copy()"
    >
      <ng-icon name="lucideCopy" aria-hidden="true" />
      {{ 'log.copy' | translate }}
    </button>
  </div>

  <div
    #scroller
    class="dr-log"
    role="log"
    tabindex="0"
    [attr.aria-label]="'log.title' | translate"
    (scroll)="onScroll()"
  >
    @if (failed()) {
    <p class="text-destructive p-3 text-sm" role="alert">
      {{ 'log.loadFailed' | translate }}
    </p>
    } @else if (loaded() && visible().length === 0) {
    <p class="text-muted-foreground p-3 text-sm">
      {{ 'log.empty' | translate }}
    </p>
    } @else { @for (entry of visible(); track entry.id) {
    <div class="dr-log-line" [attr.data-level]="entry.level">
      <time class="dr-log-time" [attr.datetime]="entry.at"
        >{{ clock(entry) }}</time
      >
      <span class="dr-log-level"
        >{{ 'log.levels.' + entry.level | translate }}</span
      >
      <span class="dr-log-message">{{ entry.message }}</span>
    </div>
    } }
  </div>
</div>
