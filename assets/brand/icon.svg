<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Mirrorbase</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17808a"/>
      <stop offset="1" stop-color="#0a3d44"/>
    </linearGradient>
    <!-- The separators are clipped to the cylinder's width: a stroke on a vertical tangent would
         otherwise reach past the edge. -->
    <clipPath id="body-left"><rect x="96" y="150" width="108" height="190"/></clipPath>
    <clipPath id="body-right"><rect x="308" y="150" width="108" height="190"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- The mark is drawn around (256, 240) and scaled up to fill the tile. -->
  <g transform="translate(256 256) scale(1.16) translate(-256 -240)">
    <!-- The source database: a cylinder with two disc separators. -->
    <path d="M96 170v140a54 24 0 0 0 108 0V170z" fill="#ffffff"/>
    <ellipse cx="150" cy="170" rx="54" ry="24" fill="#d6eef0"/>
    <path clip-path="url(#body-left)" d="M96 218a54 24 0 0 0 108 0M96 264a54 24 0 0 0 108 0" fill="none" stroke="#0f5c63" stroke-width="9"/>

    <!-- The copy: the same cylinder on the right. -->
    <path d="M308 170v140a54 24 0 0 0 108 0V170z" fill="#ffffff"/>
    <ellipse cx="362" cy="170" rx="54" ry="24" fill="#d6eef0"/>
    <path clip-path="url(#body-right)" d="M308 218a54 24 0 0 0 108 0M308 264a54 24 0 0 0 108 0" fill="none" stroke="#0f5c63" stroke-width="9"/>

    <!-- The transfer: a shaft and an arrowhead, with air on both sides. -->
    <path d="M222 250h30" fill="none" stroke="#f7c948" stroke-width="20" stroke-linecap="round"/>
    <path d="M250 222l38 28-38 28z" fill="#f7c948" stroke="#f7c948" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
