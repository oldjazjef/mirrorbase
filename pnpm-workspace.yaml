# This is an integrated Nx workspace: every dependency lives in the root manifest and apps carry
# no package.json of their own.
packages:
  - 'apps/*'

# pnpm 10+ refuses to run dependency install scripts unless they are allowlisted here. Leaving one
# out fails later, at build or watch time, not at install time.
#   esbuild, @swc/core, @parcel/watcher, lmdb, msgpackr-extract, nx, less, unrs-resolver
#                      Angular / Nx toolchain binaries
#   prisma, @prisma/engines  the CLI's schema-engine binary, needed by `migrate`
#   better-sqlite3     the SQLite driver behind Prisma's adapter (and the app's own database)
#   electron           downloads the Electron binary (apps/desktop)
# `@nestjs/core` only prints a sponsorship notice and `@scarf/scarf` phones home: both stay off.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  better-sqlite3: true
  electron: true
  '@swc/core': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  prisma: true
  unrs-resolver: true
  '@nestjs/core': false
  '@scarf/scarf': false
  electron-winstaller: false

# Nx is pinned to one exact version, but @spartan-ng/cli depends on `@nx/devkit` with a caret range
# and would otherwise pull the newest one. Keep these in step with `nx`.
overrides:
  '@nx/devkit': 23.2.1
  nx: 23.2.1
